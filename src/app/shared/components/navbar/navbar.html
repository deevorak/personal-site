<header class="site-header sticky-top" [class.is-scrolled]="isScrolled()">
  <nav class="navbar navbar-expand-xl py-2 py-lg-3" aria-label="Navegação principal">
    <div class="container">
      <a
        class="navbar-brand d-flex align-items-center me-2 py-0"
        href="#inicio"
        (click)="navigateTo('inicio', $event)"
      >
        @if (themeService.isDark()) {
          <picture class="brand-logo-picture">
            <source srcset="brand/logo-horizontal.webp" type="image/webp" />
            <img
              src="brand/logo-horizontal.png"
              alt="Carlos Rocha Consultoria em TI"
              width="208"
              height="54"
              fetchpriority="high"
              decoding="async"
              class="brand-logo-img"
            />
          </picture>
        } @else {
          <picture class="brand-logo-picture">
            <source srcset="brand/logo-horizontal-light.webp" type="image/webp" />
            <img
              src="brand/logo-horizontal-light.png"
              alt="Carlos Rocha Consultoria em TI"
              width="208"
              height="54"
              fetchpriority="high"
              decoding="async"
              class="brand-logo-img"
            />
          </picture>
        }
      </a>

      <button
        class="navbar-toggler px-2 py-1"
        type="button"
        aria-controls="mainNavbarNav"
        [attr.aria-expanded]="!isMenuCollapsed()"
        aria-label="Alternar menu de navegação"
        (click)="toggleMenu()"
      >
        <i
          class="bi fs-4 text-dark"
          [class.bi-list]="isMenuCollapsed()"
          [class.bi-x-lg]="!isMenuCollapsed()"
          aria-hidden="true"
        ></i>
      </button>

      <div id="mainNavbarNav" class="collapse navbar-collapse" [ngbCollapse]="isMenuCollapsed()">
        <ul class="navbar-nav mx-xl-auto my-3 my-xl-0 gap-1 align-items-xl-center">
          @for (item of navLinks; track item.id) {
            <li class="nav-item">
              <a
                class="nav-link text-nowrap px-2 px-xxl-3 py-2"
                [href]="'#' + item.id"
                [attr.aria-current]="activeSection() === item.id ? 'location' : null"
                [class.is-active]="activeSection() === item.id"
                (click)="navigateTo(item.id, $event)"
              >
                {{ item.label }}
              </a>
            </li>
          }
        </ul>

        <div class="d-flex flex-column flex-sm-row align-items-stretch align-items-sm-center gap-2 pt-2 pt-xl-0 border-top border-xl-0">
          <button
            type="button"
            class="btn btn-outline-tech-neutral btn-sm theme-toggle-btn px-3 py-2 d-inline-flex align-items-center justify-content-center gap-2"
            [attr.title]="themeService.toggleTooltip()"
            (click)="themeService.toggleTheme()"
          >
            <span class="theme-option-when-light d-inline-flex align-items-center gap-2">
              <i class="bi bi-moon-stars" aria-hidden="true"></i>
              <span><span class="visually-hidden">Ativar </span><span class="theme-toggle-text">tema escuro</span></span>
            </span>
            <span class="theme-option-when-dark d-inline-flex align-items-center gap-2">
              <i class="bi bi-sun" aria-hidden="true"></i>
              <span><span class="visually-hidden">Ativar </span><span class="theme-toggle-text">tema claro</span></span>
            </span>
          </button>
        </div>
      </div>
    </div>
  </nav>
</header>
