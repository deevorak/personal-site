<header class="site-header sticky-top" [class.is-scrolled]="isScrolled()">
  <nav class="navbar navbar-expand-xl py-2 py-lg-3" aria-label="Navegação principal">
    <div class="container">
      <a
        class="navbar-brand d-flex align-items-center gap-2 gap-sm-3 me-2"
        href="#inicio"
        (click)="navigateTo('inicio', $event)"
      >
        <span class="brand-monogram" aria-hidden="true">CR</span>
        <span class="d-flex flex-column lh-sm">
          <span class="brand-name">{{ contactService.ownerName }}</span>
          <span class="brand-role">Analista de TI &amp; Desenvolvedor de Software</span>
        </span>
      </a>

      <button
        class="navbar-toggler border-0 px-2 py-1"
        type="button"
        aria-controls="mainNavbarNav"
        [attr.aria-expanded]="!isMenuCollapsed()"
        aria-label="Alternar menu de navegação"
        (click)="toggleMenu()"
      >
        <i
          class="bi fs-4 text-dark"
          [class.bi-list]="isMenuCollapsed()"
          [class.bi-x-lg]="!isMenuCollapsed()"
          aria-hidden="true"
        ></i>
      </button>

      <div id="mainNavbarNav" class="collapse navbar-collapse" [ngbCollapse]="isMenuCollapsed()">
        <ul class="navbar-nav mx-xl-auto my-3 my-xl-0 gap-1 align-items-xl-center">
          @for (item of navLinks; track item.id) {
            <li class="nav-item">
              <a
                class="nav-link text-nowrap px-2 px-xxl-3 py-2 rounded-2"
                [href]="'#' + item.id"
                [attr.aria-current]="activeSection() === item.id ? 'location' : null"
                [class.is-active]="activeSection() === item.id"
                (click)="navigateTo(item.id, $event)"
              >
                {{ item.label }}
              </a>
            </li>
          }
        </ul>

        <div class="d-flex flex-column flex-sm-row align-items-stretch align-items-sm-center gap-2 pt-2 pt-xl-0 border-top border-xl-0">
          <a
            class="btn btn-outline-slate btn-sm px-3 py-2 d-inline-flex align-items-center justify-content-center gap-2"
            [href]="contactService.emailHref"
            [attr.aria-label]="'Enviar e-mail para ' + contactService.email"
          >
            <i class="bi bi-envelope" aria-hidden="true"></i>
            <span>E-mail</span>
          </a>

          <a
            class="btn btn-whatsapp btn-sm px-3 py-2 d-inline-flex align-items-center justify-content-center gap-2"
            [href]="contactService.whatsappUrl()"
            target="_blank"
            rel="noopener noreferrer"
          >
            <i class="bi bi-whatsapp" aria-hidden="true"></i>
            <span>Falar no WhatsApp</span>
          </a>
        </div>
      </div>
    </div>
  </nav>
</header>
